# EtherNet/IP Scanner device table.
#
# Mounted at /etc/softplc/scanner-devices.conf by default, or pointed at with
# SOFTPLC_SCANNER_DEVICES. Both the PLC core and the scanner process read it,
# and the scanner refuses to start if the two disagree.
#
# Devices are packed into %I and %Q in the order they appear here, so the
# process image map reads straight off this file.
#
# %I layout:  [health: one byte per device] [device T->O slices, in order]
# %Q layout:  [device O->T slices, in order]
#
# Health byte values: 0 = offline (never connected), 1 = online,
#                     2 = connection lost, failsafe applied to that slice.
#
# columns:
#   ip        the device's address
#   cfg       configuration assembly instance
#   o2t       originator->target assembly  (receives PLC %Q)
#   t2o       target->originator assembly  (feeds PLC %I)
#   o2t_len   O->T image size, bytes
#   t2o_len   T->O image size, bytes
#   rpi_us    requested packet interval, microseconds
#   failsafe  hold | clear, applied to THIS device's slice when it drops
#
# Every field is required: a defaulted RPI or image size is a plant fault
# waiting to happen.

# ip             cfg  o2t  t2o  o2t_len  t2o_len  rpi_us  failsafe
192.168.1.10     151  150  100  32       32       10000   hold
192.168.1.11     151  150  100  8        8        10000   clear
192.168.1.12     151  150  100  16       16       20000   hold
192.168.1.13     151  150  100  4        4        10000   hold
