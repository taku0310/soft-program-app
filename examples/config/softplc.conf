# ---------------------------------------------------------------------------
# soft PLC configuration.
#
# Mounted at /etc/softplc/softplc.conf, or pointed at with SOFTPLC_CONFIG.
#
# Every setting here is also an environment variable, and the environment
# wins: a key in section `S` is `SOFTPLC_S_KEY`, and [core] contributes no
# prefix, so `[eip] interface` below is SOFTPLC_EIP_INTERFACE.  A key already
# spelled SOFTPLC_... is taken as-is, so anything copied out of a compose file
# can be pasted straight in.
#
# `softplc --show-config` prints what this resolved to and flags anything the
# environment is overriding.
# ---------------------------------------------------------------------------

[core]

# What this PLC is on the network.  `softplc --list-roles` lists what this
# build supports.
#
#   none      no fieldbus; the loopback adapter gives the program a process
#             image to drive, for testing logic without a network
#   adapter   an EtherNet/IP Adapter (target): a device that some other
#             controller scans.  Listens on TCP/UDP 44818 and UDP 2222
#   scanner   an EtherNet/IP Scanner (originator): drives the remote devices
#             listed in the device table below.  Opens outbound connections,
#             listens on nothing
#
# One value, not a list, and that is a protocol constraint rather than a
# simplification: CIP class 1 I/O uses UDP 2222 at *both* ends, so an Adapter
# and a Scanner in one network namespace receive each other's traffic.  Both
# roles at once needs two namespaces - two containers, or two pods.  See
# docs/adr/0010-single-container-role-switch.md.
role = adapter

# Namespace for the shared memory and semaphores the core and the stack
# process meet on.  Two PLCs on one host need two different values.
instance = line1

# Scan period.  The whole cycle - read inputs, run the program, write outputs -
# has to fit inside this; `max_scan` in the shutdown line says how close it got.
cycle_us = 10000

# What the outputs do when the stack stops delivering fresh data.
#   hold    freeze the last good image
#   clear   zero it
# See docs/adr/0005-failsafe-policy.md.
failsafe = hold

# Stop after this many scans.  0 (or absent) runs until signalled; useful only
# for smoke tests.
# max_scans = 0

# error | warn | info | debug
# log_level = info

# --- single-container supervision ------------------------------------------
#
# Read by docker/entrypoint.sh, which is the supervisor when the core and the
# stack share a container.  A stack crash never reaches the PLC - that is what
# the process split is for - so restarting it here is recovery, not a
# workaround; the core keeps scanning on failsafe values throughout.
#
# stack_restart          = on      # on | off
# stack_restart_delay_ms = 1000

# ---------------------------------------------------------------------------
# role = adapter
# ---------------------------------------------------------------------------
[eip]

# Interface OpENer binds and reads the MAC from.
interface = eth0

# Process image sizes, in bytes.  These have to match what the controller
# scanning this device is configured to exchange.
input_bytes  = 32
output_bytes = 32

# CIP assembly instances.  As an Adapter this PLC is the target, so the
# scanner owns the connection and the directions are named from its end:
#   produced (T->O) carries this PLC's %Q outward
#   consumed (O->T) delivers this PLC's %I
# The defaults follow the usual convention; change them to match an existing
# EDS.
# produced_assembly = 100
# consumed_assembly = 150
# config_assembly   = 151

# How long one exchange with the stack process may take before the scan gives
# up on it, and how long the image may go stale before failsafe is applied.
# Both were set from measurement - see docs/adr/0009.
# exchange_timeout_us = 5000
# failsafe_timeout_us = 100000

# ---------------------------------------------------------------------------
# role = scanner
# ---------------------------------------------------------------------------
[scanner]

# The remote devices this PLC drives.  A table, not flat settings: per device
# an address, three assembly instances, two image sizes, an RPI, a timeout
# multiplier and a failsafe policy.
devices = /etc/softplc/scanner-devices.conf
